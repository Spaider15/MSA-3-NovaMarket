http {
    upstream logistics_backend {
        zone logistics_backend 64k;
        server logistics.company.com max_fails=5 fail_timeout=30s;
        server 127.0.0.1:8081 backup;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_set_header Host logistics.company.com;

            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;

            proxy_next_upstream error timeout http_500 http_502 http_504 non_idempotent;
        }
    }

    server {
        listen 127.0.0.1:8081;
        server_name logistics_fallback;

        location / {
            default_type application/json;
            add_header Retry-After 30 always;
            return 503 '{"error":"logistics_unavailable","message":"Logistics service is temporarily unavailable, try again later"}';
        }
    }
}

http {
    map $http_x_client_type $web_limit_key {
        web      $binary_remote_addr;
        default  "";
    }

    map $http_x_client_type $mobile_limit_key {
        web      "";
        default  $binary_remote_addr;
    }

    limit_req_zone $web_limit_key zone=web_api:10m rate=50r/s;
    limit_req_zone $mobile_limit_key zone=mobile_api:10m rate=30r/s;

    server {
        listen 80;

        # Веб и мобилки сейчас обращаются на этот ресурс
        location /api/ {
            limit_req zone=web_api burst=50 nodelay;
            limit_req zone=mobile_api burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }
    }
}
